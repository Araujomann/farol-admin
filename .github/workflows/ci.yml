name: CI

on:
    push:
        branches: [development, main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        env:
            # O build não chama a API; o valor só satisfaz a configuração.
            CRASHMAP_API_URL: http://localhost:3333
            NEXT_TELEMETRY_DISABLED: 1

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build
